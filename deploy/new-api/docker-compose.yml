services:
  new-api:
    image: calciumion/new-api:latest
    container_name: new-api
    restart: unless-stopped
    # 只监听本机回环：公网一律走 Caddy，面板走 SSH 隧道
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
      SESSION_SECRET: ${SESSION_SECRET}
      # 留空则使用内置 SQLite（./data/one-api.db），小规模足够
      SQL_DSN: ${SQL_DSN:-}
      ERROR_LOG_ENABLED: "true"
      # 单机部署保持 false；多实例才需要 true
      NODE_TYPE: "slave"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: mnk-caddy
    restart: unless-stopped
    depends_on:
      - new-api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      ALLOW_ORIGIN: ${ALLOW_ORIGIN}
      NEWAPI_TOKEN: ${NEWAPI_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
